<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un Atelier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>SCREEN SHARE</h1>
        <p>Ajouter une nouvelle session</p>
        
        <!-- Formulaire pour ajouter un atelier -->
        <form id="session-form">
            <input type="text" name="workshop" id="workshop" placeholder="Nom de l'atelier" required>
            <input type="text" name="lead" id="lead" placeholder="Nom de l'instructeur" required>
            <button type="submit">Enregistrer</button>
        </form>
        
        <a href="/host/bienvenue.html"><button>Retour</button></a>
    </div>

    <script>

        const form = document.getElementById('session-form')
        form.addEventListener('submit', async function(event) {
            event.preventDefault()
            const formdata = new FormData(form);
            const formobject = {};

            // Convert FormData to a plain JavaScript object
            formdata.forEach((value, key) => {
                formobject[key] = value;
            });

            const jsondata = JSON.stringify(formobject);  // Convert object to JSON string

            // Send the JSON data via fetch (POST request)
            try {
                const response = await fetch('/sessions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: jsondata,
                });

                if (response.ok) {
                    const responsedata = await response.json();
                    window.location.href = `/ui/host/partage.html?session_id=${responsedata.session_id}`;
                } else {
                    console.error('Error:', response.statusText);
                }
            } catch (error) {
                console.error('Error sending data:', error);
            }

        });
    </script>
</body>
</html>
