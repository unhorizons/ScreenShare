<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage du Live</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body>
    <canvas id="videoCanvas"></canvas>
    <div class="container">
        <h1>Live en cours...</h1>
        
        
    </div>


    <canvas id="videoCanvas"></canvas>
    <script>
        const canvas = document.getElementById("videoCanvas");
        const ctx = canvas.getContext("2d");
    
        const ws = new WebSocket(`${window.location.origin.replace("http", "ws")}/ws/stream`);
        ws.binaryType = "arraybuffer";  // Receive binary data as ArrayBuffer
    
        ws.onmessage = async (event) => {
            try {
                const arrayBuffer = event.data;
                const imageBitmap = await createImageBitmap(new Blob([arrayBuffer], { type: "image/jpeg" }));
    
                // Resize canvas if needed
                if (canvas.width !== imageBitmap.width || canvas.height !== imageBitmap.height) {
                    canvas.width = imageBitmap.width;
                    canvas.height = imageBitmap.height;
                }
    
                ctx.drawImage(imageBitmap, 0, 0);  // Directly draw the frame to the canvas
            } catch (error) {
                console.error("Error rendering frame:", error);
            }
        };
    
        ws.onclose = () => console.log("WebSocket connection closed");
    </script>
