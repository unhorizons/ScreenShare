<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choisir un Pseudo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Choisissez votre Pseudo</h1>
        <form id="login-form">

            <input type="text" id="username" name="username" placeholder="Entrez votre pseudo...">
            <button type="submit" id="join-btn">Rejoinde la session</button>
            
        </form>
    </div>

    <script src="/static/axios.min.js"></script>
    <script>

        const params = new URLSearchParams(window.location.search)
        const session_id = params.get('session_id')

        const form = document.getElementById('login-form')
        form.addEventListener('submit', async function(event) {
            event.preventDefault()

            const formdata = new FormData(form);
            const formobject = {};

            // Convert FormData to a plain JavaScript object
            formdata.forEach((value, key) => {
                formobject[key] = value;
            });
            
            const {data} = await axios.post(`/users`, formobject)

            if (data.token) {
                localStorage.setItem('jwt', data.token);
                window.location.href = `/ui/client/live.html?session_id=${session_id}`;
                
            } else {
                alert(`Login failed! : ${data.detail}`);
            }

        } )
    </script>
</body>
</html>
